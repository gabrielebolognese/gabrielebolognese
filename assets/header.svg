<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Gabriele Bolognese, founder of FlashFX">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="1"/>
      <stop offset="18%" stop-color="#7c3aed" stop-opacity="0.86"/>
      <stop offset="38%" stop-color="#6d28d9" stop-opacity="0.58"/>
      <stop offset="60%" stop-color="#6d28d9" stop-opacity="0.28"/>
      <stop offset="82%" stop-color="#5b21b6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f7b500" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#f7b500" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#f7b500" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#ec4899" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-40%" width="120%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#1e0a4a" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- main glow: fully opaque only at the centre, fading to nothing at the edge -->
  <ellipse cx="500" cy="130" rx="500" ry="130" fill="url(#core)">
    <animate attributeName="rx" values="470;500;470" dur="9s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <animate attributeName="ry" values="118;130;118" dur="9s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </ellipse>

  <!-- two soft colour drifts, each also fading to nothing -->
  <ellipse cx="420" cy="130" rx="260" ry="96" fill="url(#warm)">
    <animate attributeName="cx" values="400;600;400" dur="14s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <animate attributeName="opacity" values="0.55;1;0.55" dur="14s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="580" cy="130" rx="240" ry="90" fill="url(#pink)">
    <animate attributeName="cx" values="610;390;610" dur="17s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="17s" repeatCount="indefinite"/>
  </ellipse>

  <g filter="url(#shadow)" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="500" y="128" font-size="58" font-weight="800" letter-spacing="-1">Gabriele Bolognese</text>
    <text x="500" y="170" font-size="19" font-weight="500" opacity="0.95">Founder of FlashFX · creative tools that run in the browser</text>
  </g>
</svg>
